name: VPhoneGaga Android 15 Gaming ROM Builder

on:
  workflow_dispatch: # इससे आप एक बटन दबाकर जब चाहें ROM बना पाएंगे

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full aria2 unrar-free

    - name: Download and Prepare Base ROM
      run: |
        echo "=== [1/4] Downloading Base ROM ==="
        mkdir workspace && cd workspace
        # नीचे दिए गए लिंक की जगह आप अपनी पसंद की किसी भी VPhoneGaga Android 12 ROM का डायरेक्ट डाउनलोड लिंक डाल सकते हैं
        # उदाहरण के लिए एक डमी यूआरएल:
        # aria2c -x 16 -s 16 "YOUR_DIRECT_DOWNLOAD_LINK_HERE" -o base_rom.7z
        # 7z x base_rom.7z -oextracted_rom/

    - name: Inject Android 15 & Anti-Ban Tweaks
      run: |
        echo "=== [2/4] Modding Build.Prop ==="
        # नोट: यह स्क्रिप्ट एक्सट्रैक्टेड रॉम की सिस्टम फाइल्स में बदलाव करेगी
        # यहाँ हम मान रहे हैं कि system.img या तो अनपैक है या स्क्रिप्ट उसे मॉडिफाई कर रही है
        
        cat <<EOT >> workspace/build.prop
        # Fake Android 15 Framework for VPhoneGaga
        ro.build.version.release=15
        ro.build.version.sdk=35
        ro.build.id=VANILLA_A15_VPHONE
        ro.product.model=ROG Phone 8 Pro
        ro.product.brand=ASUS
        ro.product.manufacturer=ASUS
        
        # Free Fire No-Lag & High FPS Tweaks
        debug.egl.hw=1
        debug.sf.nobootanimation=1
        persist.sys.use_dithering=0
        persist.sys.ui.hw=true
        ro.config.cpu_level=3
        video.accelerate.hw=1
        ro.surface_flinger.max_frame_rate=90
        EOT

    - name: Inject Anti-Ban & Root Hide Script
      run: |
        echo "=== [3/4] Creating Auto-Run Anti-Ban Script ==="
        mkdir -p workspace/init.d
        cat <<EOT > workspace/init.d/99_ff_bypass.sh
        #!/system/bin/sh
        # Free Fire Root Detection Bypass
        chmod 000 /system/xbin/su
        chmod 000 /system/bin/su
        resetprop ro.debuggable 0
        resetprop ro.secure 1
        # Clear log identifiers to prevent ID tracking
        rm -rf /data/data/com.dts.freefireth/cache/*
        rm -rf /data/data/com.dts.freefireth/code_cache/*
        EOT
        chmod +x workspace/init.d/99_ff_bypass.sh

    - name: Repack Ultimate Gaming ROM
      run: |
        echo "=== [4/4] Repacking ROM into 7z ==="
        cd workspace
        7z a -t7z -mx=9 ../VPhoneGaga_Android15_GamingROM.7z *

    - name: Upload Finished ROM
      uses: actions/upload-artifact@v4
      with:
        name: Android-15-AntiBan-ROM
        path: VPhoneGaga_Android15_GamingROM.7z
